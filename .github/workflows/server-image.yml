# main 푸시마다 서버 이미지 GHCR push + seol-gitops 태그 갱신
# k3s 노드가 arm64(OCI Ampere)라 amd64/arm64 를 각각 네이티브 러너로 빌드해 하나의 매니페스트로 합침
# 클라이언트 릴리스는 release-plz + dist 가 태그 기준으로 별도 처리
name: server-image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "proto/**"
      - "rules/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/server-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seol-jy/gomoku-server

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.tag }}"

  bump-gitops:
    needs: merge
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}  # seol-gitops contents:write PAT, 없으면 수동 갱신
    steps:
      - name: token check
        id: token
        run: echo "present=${{ env.GITOPS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Seol-JY/seol-gitops
          token: ${{ env.GITOPS_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        name: update image tag
        run: |
          set -eu
          file=apps/gomoku/kustomization.yaml
          tag='${{ needs.merge.outputs.tag }}'
          python3 - "$file" "$tag" <<'PY'
          import re, sys
          path, tag = sys.argv[1], sys.argv[2]
          s = open(path).read()
          s, n = re.subn(r'(- name: ghcr\.io/seol-jy/gomoku-server\n\s*newTag: )"?[0-9a-f]+"?', rf'\g<1>"{tag}"', s)
          assert n == 1, "image entry not found"
          open(path, "w").write(s)
          PY
          git config user.name "gomoku-ci"
          git config user.email "gomoku-ci@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "chore(gomoku): 이미지 태그 ${tag} 갱신"
          git push
