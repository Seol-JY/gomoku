# 워크스페이스 단일 버전, crates.io 미배포, 태그만 생성
# GitHub Release 는 dist 담당이라 여기서는 비활성
[workspace]
publish = false
git_only = true  # publish = false 크레이트도 태그 대상, 버전 기준은 git 태그
git_release_enable = false
git_tag_enable = false
changelog_update = true
dependencies_update = false
semver_check = false
release_commits = "^(feat|fix|perf|refactor)[(:!]"

# 태그는 client 하나에만: dist 는 태그 하나로 워크스페이스 전체 빌드
[[package]]
name = "gomoku"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_path = "./CHANGELOG.md"

# 라이브러리·서버는 릴리스 대상 아님: 버전은 워크스페이스 공통, 태그와 CHANGELOG 는 gomoku 하나로
[[package]]
name = "rules"
release = false

[[package]]
name = "proto"
release = false

[[package]]
name = "server"
release = false
